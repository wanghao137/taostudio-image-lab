name: Deploy Worker

# push 到 main 且 workers/ 或 wrangler 配置变化时自动部署 Cloudflare Worker
#（image-proxy.taostudioai.com）；也可手动触发。
# 需要 2 个 repository secrets：
#   CLOUDFLARE_API_TOKEN   — Cloudflare 面板创建（Account · Workers Scripts · Edit 模板）
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 面板右下角 Account ID
# 未配置 secrets 时本工作流自动跳过（不影响 push 的绿勾）。

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'wrangler.proxy.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets 未配置，跳过 Worker 部署（配置后自动生效）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Deploy Worker (image-proxy.taostudioai.com)
        if: steps.creds.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.proxy.jsonc

      - name: Verify deployed worker rejects foreign CORS origins
        if: steps.creds.outputs.skip != 'true'
        run: |
          sleep 5
          EVIL=$(curl -s -D - -o /dev/null -H "Origin: https://evil-cors-check.example.com" https://image-proxy.taostudioai.com/api-proxy/models | grep -ci "access-control-allow-origin" || true)
          ALLOWED=$(curl -s -D - -o /dev/null -H "Origin: https://image.taostudioai.com" https://image-proxy.taostudioai.com/api-proxy/models | grep -ci "access-control-allow-origin" || true)
          echo "evil-reflected=$EVIL allowed-reflected=$ALLOWED"
          if [ "$EVIL" != "0" ]; then
            echo "::error::Worker 仍在反射未知 Origin —— 新代码未生效？"
            exit 1
          fi
