openapi: 3.1.0
info:
  title: TaoStudio Image Task API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:9789
security:
  - bearerAuth: []
paths:
  /v1/capabilities:
    get:
      operationId: getImageTaskCapabilities
      responses:
        '200':
          description: Engine contract and implemented capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageTaskCapabilities' }
  /v1/assets/uploads:
    post:
      operationId: uploadImageAsset
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, contentEncoding: binary }
      responses:
        '201':
          description: Uploaded source asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImageAsset' }
        '200':
          description: Existing immutable upload returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImageAsset' }
  /v1/image-jobs:
    get:
      operationId: listImageJobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ImageJobState' }
      responses:
        '200':
          description: Newest-first cursor page of image jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJobList' }
    post:
      operationId: createImageJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '200':
          description: Existing idempotent job returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '409': { description: Idempotency key conflict }
  /v1/image-jobs/{id}:
    get:
      operationId: getImageJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job and transition events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '404': { description: Job not found }
  /v1/image-jobs/{id}/cancel:
    post:
      operationId: cancelImageJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancellation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '404': { description: Job not found }
  /v1/image-jobs/{id}/retry:
    post:
      operationId: retryImageJob
      description: Requeue a failed job with a fresh attempt budget while preserving its event history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Requeued failed job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '409': { description: Job is not in the failed state }
        '404': { description: Job not found }
  /v1/image-batches:
    get:
      operationId: listImageBatches
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Newest-first image batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImageBatch' }
    post:
      operationId: createImageBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageBatchCreate' }
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '200':
          description: Existing idempotent batch returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Batch idempotency conflict or a job already belongs to another batch }
  /v1/image-batches/{id}:
    get:
      operationId: getImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch state, aggregate statistics, items, and events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/pause:
    post:
      operationId: pauseImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch paused; active jobs continue and queued jobs stop being claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Completed batch cannot be paused }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/resume:
    post:
      operationId: resumeImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Completed batch cannot be resumed }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/retry-failed:
    post:
      operationId: retryFailedImageBatchJobs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Failed jobs requeued with fresh attempt budgets and the batch resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch not found }
  /v1/assets/{id}:
    get:
      operationId: getImageAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: manifest
          in: query
          description: Set to 1 to return the JSON manifest instead of PNG bytes.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Immutable PNG bytes or its manifest
          content:
            image/png: { schema: { type: string, contentEncoding: binary } }
            application/json:
              schema:
                $ref: ../../packages/image-job-core/schemas/image-asset-manifest-v1.schema.json
        '404': { description: Asset not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ImageJobState:
      type: string
      enum: [queued, validating, generating, source_ready, enhancing, finalizing, succeeded, failed, cancelled]
    ImageJobEvent:
      type: object
      required: [state, detail, createdAt]
      properties:
        state: { $ref: '#/components/schemas/ImageJobState' }
        detail: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ImageGenerationRoute:
      type: object
      required: [provider, model, apiMode]
      properties:
        provider: { type: string }
        model: { type: string }
        apiMode: { type: string, enum: [images, responses] }
    ImageProviderCall:
      type: object
      required: [id, attempt, routeIndex, route, state, startedAt]
      properties:
        id: { type: integer }
        attempt: { type: integer, minimum: 1 }
        routeIndex: { type: integer, minimum: 0, maximum: 1 }
        route: { $ref: '#/components/schemas/ImageGenerationRoute' }
        state: { type: string, enum: [started, succeeded, failed, interrupted] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        usage: { type: [object, 'null'], additionalProperties: true }
        error: { type: [object, 'null'], additionalProperties: true }
        httpStatus: { type: [integer, 'null'] }
    ImageJobAccounting:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          items: { $ref: '#/components/schemas/ImageProviderCall' }
    ImageJob:
      type: object
      required: [id, contractVersion, request, state, attempts, routeIndex, routeAttempts, maxAttempts, actualRoute, cancelRequested, createdAt, updatedAt]
      properties:
        id: { type: string }
        contractVersion: { const: '1' }
        request:
          $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
        state: { $ref: '#/components/schemas/ImageJobState' }
        attempts: { type: integer, minimum: 0 }
        routeIndex: { type: integer, minimum: 0, maximum: 1 }
        routeAttempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1, maximum: 5 }
        actualRoute: { $ref: '#/components/schemas/ImageGenerationRoute' }
        cancelRequested: { type: boolean }
        sourceAssetId: { type: [string, 'null'] }
        finalAssetId: { type: [string, 'null'] }
        error: { type: [object, 'null'], additionalProperties: true }
        result: { type: [object, 'null'], additionalProperties: true }
        accounting: { $ref: '#/components/schemas/ImageJobAccounting' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ImageJobEvent' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageJobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImageJob' }
        nextCursor: { type: [string, 'null'] }
    ImageBatchCreate:
      type: object
      required: [idempotencyKey, items]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [itemKey, request]
            properties:
              itemKey: { type: string, minLength: 1, maxLength: 200 }
              request:
                $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
    ImageBatch:
      type: object
      required: [id, state, controlState, stats, items, events, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        state: { type: string, enum: [running, paused, completed] }
        controlState: { type: string, enum: [running, paused] }
        stats:
          type: object
          required: [total, terminal, active, queued, succeeded, failed, cancelled]
          properties:
            total: { type: integer }
            terminal: { type: integer }
            active: { type: integer }
            queued: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [itemKey, position, job]
            properties:
              itemKey: { type: string }
              position: { type: integer }
              job: { $ref: '#/components/schemas/ImageJob' }
        events:
          type: array
          items:
            type: object
            required: [event, detail, createdAt]
            properties:
              event: { type: string }
              detail: { type: [object, 'null'], additionalProperties: true }
              createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UploadedImageAsset:
      type: object
      required: [assetId, manifest]
      properties:
        assetId: { type: string }
        manifest:
          $ref: ../../packages/image-job-core/schemas/image-asset-manifest-v1.schema.json
    ImageTaskCapabilities:
      type: object
      required: [service, apiVersion, contractVersion, manifestVersion, capabilities]
      properties:
        service: { const: taostudio-image-task-api }
        apiVersion: { const: '1' }
        contractVersion: { const: '1' }
        manifestVersion: { const: '1' }
        capabilities:
          type: object
          required: [inputModes, apiModes, ratios, generation, output, retry, upload, jobs, events]
          properties:
            inputModes:
              type: array
              items: { type: string, enum: [prompt, source, edit] }
            apiModes:
              type: array
              items: { type: string, enum: [images, responses] }
            ratios:
              type: array
              items: { type: string }
            generation:
              type: object
              required: [defaultProvider, defaultModel]
              properties:
                defaultProvider: { const: configured }
                defaultModel: { type: [string, 'null'] }
            output:
              type: object
              required: [formats, qualities, acceptedEnhancements, implementedEnhancements, enhancementFallback, maxEdge, maxPixels]
              properties:
                formats: { type: array, items: { const: png } }
                qualities: { type: array, items: { const: high } }
                acceptedEnhancements:
                  type: array
                  items: { type: string, enum: [auto, none, lanczos3, real-esrgan, hat] }
                implementedEnhancements: { type: array, items: { type: string } }
                enhancementFallback: { type: string }
                maxEdge: { type: integer }
                maxPixels: { type: integer }
            retry:
              type: object
              required: [maxAttempts]
              properties:
                maxAttempts: { type: integer, minimum: 1, maximum: 5 }
            upload:
              type: object
              required: [mediaTypes, maxBytes]
              properties:
                mediaTypes: { type: array, items: { const: image/png } }
                maxBytes: { type: integer }
            jobs:
              type: object
              required: [states, defaultListLimit, maxListLimit]
              properties:
                states: { type: array, items: { $ref: '#/components/schemas/ImageJobState' } }
                defaultListLimit: { type: integer }
                maxListLimit: { type: integer }
            events:
              type: object
              required: [transport]
              properties:
                transport: { const: polling }
