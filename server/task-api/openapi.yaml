openapi: 3.1.0
info:
  title: TaoStudio Image Task API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:9789
security:
  - bearerAuth: []
paths:
  /v1/capabilities:
    get:
      operationId: getImageTaskCapabilities
      responses:
        '200':
          description: Engine contract and implemented capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageTaskCapabilities' }
  /v1/assets/uploads:
    post:
      operationId: uploadImageAsset
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, contentEncoding: binary }
      responses:
        '201':
          description: Uploaded source asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImageAsset' }
        '200':
          description: Existing immutable upload returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImageAsset' }
  /v1/image-jobs:
    get:
      operationId: listImageJobs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ImageJobState' }
      responses:
        '200':
          description: Newest-first cursor page of image jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJobList' }
    post:
      operationId: createImageJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '200':
          description: Existing idempotent job returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '409': { description: Idempotency key conflict }
  /v1/image-jobs/{id}:
    get:
      operationId: getImageJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job and transition events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '404': { description: Job not found }
  /v1/image-jobs/{id}/cancel:
    post:
      operationId: cancelImageJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancellation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '404': { description: Job not found }
  /v1/image-jobs/{id}/retry:
    post:
      operationId: retryImageJob
      description: Requeue a failed job with a fresh attempt budget while preserving its event history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Requeued failed job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageJob' }
        '409': { description: Job is not in the failed state }
        '404': { description: Job not found }
  /v1/image-batches:
    get:
      operationId: listImageBatches
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Newest-first image batches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImageBatchSummary' }
    post:
      operationId: createImageBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageBatchCreate' }
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '200':
          description: Existing idempotent batch returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Batch idempotency conflict or a job already belongs to another batch }
  /v1/image-batches/{id}:
    get:
      operationId: getImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch state, aggregate statistics, items, and events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch not found }
  /v1/image-batches/by-logical-key/{logicalKey}:
    get:
      operationId: getImageBatchByLogicalKey
      description: Resolve the durable batch for one manifest scope before starting or resuming a runner.
      parameters:
        - { name: logicalKey, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      responses:
        '200':
          description: Durable logical batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Logical batch not found }
  /v1/image-batches/{id}/runner/acquire:
    post:
      operationId: acquireImageBatchRunner
      description: Atomically acquire the exclusive runner lease for one logical batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerLeaseRequest' }
      responses:
        '200':
          description: Runner lease acquired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Another runner holds an unexpired lease }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/runner/heartbeat:
    post:
      operationId: heartbeatImageBatchRunner
      description: Renew a runner lease held by the supplied owner.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerLeaseRequest' }
      responses:
        '200':
          description: Runner lease renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Lease expired or belongs to another runner }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/runner/release:
    post:
      operationId: releaseImageBatchRunner
      description: Release a runner lease after a normal exit.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerReleaseRequest' }
      responses:
        '200':
          description: Runner lease released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Lease belongs to another runner }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/logical-key:
    post:
      operationId: adoptImageBatchLogicalKey
      description: Attach a stable logical key to a legacy persisted batch before restart recovery.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogicalKeyRequest' }
      responses:
        '200':
          description: Batch now has the supplied logical key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Batch or logical key belongs to another logical scope }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/pause:
    post:
      operationId: pauseImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch paused; active jobs continue and queued jobs stop being claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Completed batch cannot be paused }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/resume:
    post:
      operationId: resumeImageBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Batch resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '409': { description: Completed batch cannot be resumed }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/retry-failed:
    post:
      operationId: retryFailedImageBatchJobs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Failed jobs requeued with fresh attempt budgets and the batch resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch not found }
  /v1/image-batches/{id}/items/{itemKey}/review:
    post:
      operationId: reviewImageBatchItem
      description: Record a human delivery decision for one succeeded batch item. AI QA uses the separate advisory endpoint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageBatchItemReview' }
      responses:
        '200':
          description: Updated batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch item not found }
        '409': { description: Human review requires a succeeded job }
  /v1/image-batches/{id}/items/{itemKey}/qa:
    post:
      operationId: recordImageBatchItemQa
      description: Record AI QA evidence. A passed result auto-confirms delivery; warnings remain pending human review and do not change the generated asset.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageBatchItemQa' }
      responses:
        '200':
          description: Updated batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch item not found }
  /v1/image-batches/{id}/items/{itemKey}/job:
    post:
      operationId: replaceImageBatchItemJob
      description: Attach a new revision job to a terminal batch item while preserving job history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Updated batch with the replacement job active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageBatch' }
        '404': { description: Batch item not found }
        '409': { description: Current batch item job is not terminal }
  /v1/assets/{id}:
    get:
      operationId: getImageAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: manifest
          in: query
          description: Set to 1 to return the JSON manifest instead of PNG bytes.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Immutable PNG bytes or its manifest
          content:
            image/png: { schema: { type: string, contentEncoding: binary } }
            application/json:
              schema:
                $ref: ../../packages/image-job-core/schemas/image-asset-manifest-v1.schema.json
        '404': { description: Asset not found }
  /v1/assets/{id}/thumbnail:
    get:
      operationId: getImageAssetThumbnail
      description: Return a resized WebP thumbnail for review grids.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: width
          in: query
          schema: { type: integer, minimum: 96, maximum: 768, default: 320 }
      responses:
        '200':
          description: WebP thumbnail
          content:
            image/webp: { schema: { type: string, contentEncoding: binary } }
        '404': { description: Asset not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ImageJobState:
      type: string
      enum: [queued, validating, generating, source_ready, enhancing, finalizing, succeeded, failed, cancelled]
    ImageJobEvent:
      type: object
      required: [state, detail, createdAt]
      properties:
        state: { $ref: '#/components/schemas/ImageJobState' }
        detail: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ImageGenerationRoute:
      type: object
      required: [provider, model, apiMode]
      properties:
        provider: { type: string }
        model: { type: string }
        apiMode: { type: string, enum: [images, responses] }
    ImageProviderCall:
      type: object
      required: [id, attempt, routeIndex, route, state, startedAt]
      properties:
        id: { type: integer }
        attempt: { type: integer, minimum: 1 }
        routeIndex: { type: integer, minimum: 0, maximum: 1 }
        route: { $ref: '#/components/schemas/ImageGenerationRoute' }
        state: { type: string, enum: [started, succeeded, failed, interrupted] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        usage: { type: [object, 'null'], additionalProperties: true }
        error: { type: [object, 'null'], additionalProperties: true }
        httpStatus: { type: [integer, 'null'] }
    ImageJobAccounting:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          items: { $ref: '#/components/schemas/ImageProviderCall' }
    ImageJob:
      type: object
      required: [id, contractVersion, request, state, attempts, routeIndex, routeAttempts, maxAttempts, actualRoute, cancelRequested, createdAt, updatedAt]
      properties:
        id: { type: string }
        contractVersion: { const: '1' }
        request:
          $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
        state: { $ref: '#/components/schemas/ImageJobState' }
        attempts: { type: integer, minimum: 0 }
        routeIndex: { type: integer, minimum: 0, maximum: 1 }
        routeAttempts: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1, maximum: 5 }
        actualRoute: { $ref: '#/components/schemas/ImageGenerationRoute' }
        cancelRequested: { type: boolean }
        sourceAssetId: { type: [string, 'null'] }
        finalAssetId: { type: [string, 'null'] }
        error: { type: [object, 'null'], additionalProperties: true }
        result: { type: [object, 'null'], additionalProperties: true }
        accounting: { $ref: '#/components/schemas/ImageJobAccounting' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ImageJobEvent' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImageJobList:
      type: object
      required: [items, nextCursor, stats]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ImageJob' }
        nextCursor: { type: [string, 'null'] }
        stats:
          $ref: '#/components/schemas/ImageJobStats'
    ImageJobStats:
      type: object
      required: [total, terminal, active, queued, succeeded, failed, cancelled, byState, matching]
      properties:
        total: { type: integer }
        terminal: { type: integer }
        active: { type: integer }
        queued: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        matching: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
    ImageBatchCreate:
      type: object
      required: [idempotencyKey, items]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        logicalKey: { type: string, minLength: 8, maxLength: 200, description: Stable identity for one logical manifest scope across runner attempts }
        name: { type: string, minLength: 1, maxLength: 200 }
        automation: { $ref: '#/components/schemas/ImageBatchAutomation' }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [itemKey, request]
            properties:
              itemKey: { type: string, minLength: 1, maxLength: 200 }
              copies: { type: integer, minimum: 1, maximum: 10 }
              request:
                $ref: ../../packages/image-job-core/schemas/image-job-contract-v1.schema.json
    ImageBatchAutomation:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        autoRevise: { type: boolean, default: false, description: Enable automatic revision after QA or policy failure. Disabled by default. }
        maxRevisions: { type: integer, minimum: 0, maximum: 3, default: 2 }
        revisionRoute:
          type: object
          required: [provider, model, apiMode]
          properties:
            provider: { type: string, minLength: 1 }
            model: { type: string, minLength: 1 }
            apiMode: { const: responses }
    ImageBatch:
      type: object
      required: [id, state, controlState, automation, acceptanceState, stats, items, events, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        logicalKey: { type: [string, 'null'] }
        state: { type: string, enum: [running, paused, completed] }
        controlState: { type: string, enum: [running, paused] }
        pauseReason: { type: [string, 'null'] }
        runner:
          type: object
          required: [active, owner, attempt, heartbeatAt, leaseExpiresAt]
          properties:
            active: { type: boolean }
            owner: { type: [string, 'null'] }
            attempt: { type: integer, minimum: 0 }
            heartbeatAt: { type: [string, 'null'], format: date-time }
            leaseExpiresAt: { type: [string, 'null'], format: date-time }
        automation: { $ref: '#/components/schemas/ImageBatchAutomation' }
        acceptanceState: { type: string, enum: [pending, accepted, needs_review, rejected] }
        stats:
          type: object
          required: [total, terminal, active, queued, succeeded, failed, cancelled, accepted, needsReview, rejected, acceptancePending, qaPassed, qaFailed, qaNeedsReview, qaNotRun, humanReviewPending, humanReviewApproved, humanReviewRejected]
          properties:
            total: { type: integer }
            terminal: { type: integer }
            active: { type: integer }
            queued: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
            accepted: { type: integer }
            needsReview: { type: integer }
            rejected: { type: integer }
            acceptancePending: { type: integer }
            qaPassed: { type: integer }
            qaFailed: { type: integer }
            qaNeedsReview: { type: integer }
            qaNotRun: { type: integer }
            humanReviewPending: { type: integer }
            humanReviewApproved: { type: integer }
            humanReviewRejected: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [itemKey, sourceItemKey, position, outputIndex, outputCount, revision, automationState, generationStatus, qaStatus, acceptanceStatus, humanReviewStatus, job, jobHistory]
            properties:
              itemKey: { type: string }
              sourceItemKey: { type: string }
              position: { type: integer }
              outputIndex: { type: integer, minimum: 1 }
              outputCount: { type: integer, minimum: 1, maximum: 10 }
              revision: { type: integer }
              automationState: { type: string, enum: [idle, processing, done] }
              generationStatus: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
              qaStatus: { type: string, enum: [not_run, passed, failed, needs_review] }
              acceptanceStatus: { type: string, enum: [pending, accepted, needs_review, rejected] }
              failureClass: { type: [string, 'null'] }
              recoveryAction: { type: [string, 'null'] }
              review: { type: [object, 'null'], additionalProperties: true }
              humanReviewStatus: { type: string, enum: [not_ready, pending, approved, rejected, not_applicable] }
              humanReview: { type: [object, 'null'], additionalProperties: true }
              job: { $ref: '#/components/schemas/ImageJob' }
              jobHistory:
                type: array
                items:
                  type: object
                  required: [revision, reason, createdAt, job]
                  properties:
                    revision: { type: integer }
                    reason: { type: string }
                    createdAt: { type: string, format: date-time }
                    job: { $ref: '#/components/schemas/ImageJob' }
        events:
          type: array
          items:
            type: object
            required: [event, detail, createdAt]
            properties:
              event: { type: string }
              detail: { type: [object, 'null'], additionalProperties: true }
              createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunnerLeaseRequest:
      type: object
      required: [owner, leaseMs]
      properties:
        owner: { type: string, minLength: 1, maxLength: 200 }
        leaseMs: { type: integer, minimum: 10000, maximum: 300000 }
    RunnerReleaseRequest:
      type: object
      required: [owner]
      properties:
        owner: { type: string, minLength: 1, maxLength: 200 }
    LogicalKeyRequest:
      type: object
      required: [logicalKey]
      properties:
        logicalKey: { type: string, minLength: 8, maxLength: 200 }
    ImageBatchItemReview:
      type: object
      required: [acceptanceStatus]
      properties:
        acceptanceStatus: { type: string, enum: [accepted, rejected] }
        detail: { type: object, additionalProperties: true }
    ImageBatchItemQa:
      type: object
      required: [qaStatus]
      properties:
        qaStatus: { type: string, enum: [not_run, passed, failed, needs_review] }
        failureClass: { type: string, minLength: 1, maxLength: 100 }
        recoveryAction: { type: string, minLength: 1, maxLength: 100 }
        detail: { type: object, additionalProperties: true }
    ImageBatchSummary:
      type: object
      required: [id, state, controlState, automation, acceptanceState, stats, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        logicalKey: { type: [string, 'null'] }
        outputRoot: { type: [string, 'null'] }
        state: { type: string, enum: [running, paused, completed] }
        controlState: { type: string, enum: [running, paused] }
        pauseReason: { type: [string, 'null'] }
        runner:
          type: object
          required: [active, owner, attempt, heartbeatAt, leaseExpiresAt]
          properties:
            active: { type: boolean }
            owner: { type: [string, 'null'] }
            attempt: { type: integer, minimum: 0 }
            heartbeatAt: { type: [string, 'null'], format: date-time }
            leaseExpiresAt: { type: [string, 'null'], format: date-time }
        automation: { $ref: '#/components/schemas/ImageBatchAutomation' }
        acceptanceState: { type: string, enum: [pending, accepted, needs_review, rejected] }
        stats:
          $ref: '#/components/schemas/ImageBatch/properties/stats'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UploadedImageAsset:
      type: object
      required: [assetId, manifest]
      properties:
        assetId: { type: string }
        manifest:
          $ref: ../../packages/image-job-core/schemas/image-asset-manifest-v1.schema.json
    ImageTaskCapabilities:
      type: object
      required: [service, apiVersion, contractVersion, manifestVersion, capabilities]
      properties:
        service: { const: taostudio-image-task-api }
        apiVersion: { const: '1' }
        contractVersion: { const: '1' }
        manifestVersion: { const: '1' }
        capabilities:
          type: object
          required: [inputModes, apiModes, ratios, generation, output, retry, upload, jobs, batches, events]
          properties:
            inputModes:
              type: array
              items: { type: string, enum: [prompt, source, edit] }
            apiModes:
              type: array
              items: { type: string, enum: [images, responses] }
            ratios:
              type: array
              items: { type: string }
            generation:
              type: object
              required: [defaultProvider, defaultModel]
              properties:
                defaultProvider: { const: configured }
                defaultModel: { type: [string, 'null'] }
            output:
              type: object
              required: [formats, qualities, acceptedEnhancements, implementedEnhancements, enhancementFallback, maxEdge, maxPixels]
              properties:
                formats: { type: array, items: { const: png } }
                qualities: { type: array, items: { const: high } }
                acceptedEnhancements:
                  type: array
                  items: { type: string, enum: [auto, none, lanczos3, real-esrgan, hat] }
                implementedEnhancements: { type: array, items: { type: string } }
                enhancementFallback: { type: string }
                maxEdge: { type: integer }
                maxPixels: { type: integer }
            retry:
              type: object
              required: [maxAttempts]
              properties:
                maxAttempts: { type: integer, minimum: 1, maximum: 5 }
            upload:
              type: object
              required: [mediaTypes, maxBytes]
              properties:
                mediaTypes: { type: array, items: { const: image/png } }
                maxBytes: { type: integer }
            jobs:
              type: object
              required: [states, defaultListLimit, maxListLimit]
              properties:
                states: { type: array, items: { $ref: '#/components/schemas/ImageJobState' } }
                defaultListLimit: { type: integer }
                maxListLimit: { type: integer }
            batches:
              type: object
              required: [maxItems, states, qaStatuses, acceptanceStatuses, humanReviewStatuses, automation]
              properties:
                maxItems: { type: integer }
                states:
                  type: array
                  items: { type: string, enum: [running, paused, completed] }
                qaStatuses:
                  type: array
                  items: { type: string, enum: [not_run, passed, failed, needs_review] }
                acceptanceStatuses:
                  type: array
                  items: { type: string, enum: [pending, accepted, needs_review, rejected] }
                humanReviewStatuses:
                  type: array
                  items: { type: string, enum: [not_ready, pending, approved, rejected, not_applicable] }
                automation:
                  type: object
                  required: [supported, maxRevisions, features]
                  properties:
                    supported: { type: boolean }
                    maxRevisions: { type: integer }
                    features:
                      type: array
                      items: { type: string, enum: [multi_output_expansion, safe_rewrite, visual_qa, human_review, optional_auto_revision] }
            events:
              type: object
              required: [transport]
              properties:
                transport: { const: polling }
